baseURL = "https://www.zhaoqingxu.com/"
locale = "en-us"
title = "Zhaoqing Xu | Computational Mathematics"
theme = "PaperMod"

[params]
  env = "production"
  author = "Zhaoqing Xu"
  description = "Ph.D. Candidate in Computational Mathematics at University of South Carolina"
  math = true
  defaultTheme = "light"
  images = ["og-card.png"]
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowShareButtons = false

[params.assets]
  theme_color = "#f5f8fa"
  msapplication_TileColor = "#f5f8fa"
  # Emit a STABLE stylesheet URL (/assets/css/stylesheet.css) instead of a
  # fingerprinted one. GitHub Pages serves HTML with `cache-control: max-age=600`,
  # so a browser (or CDN edge) holding HTML from the previous deploy would request
  # the previous fingerprinted CSS -- which every new build deletes -- and get a
  # 404. The page then renders with zero CSS: the nav collapses into a bare bullet
  # list and inline SVGs blow up to the 300x150 default. A stable URL can never
  # 404; the worst case is <=10 min of valid-but-slightly-older CSS.
  disableFingerprinting = true

[params.profileMode]
  enabled = false

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 1

[[menu.main]]
  name = "Research"
  url = "/research/"
  weight = 2

[[menu.main]]
  name = "Teaching"
  url = "/teaching/"
  weight = 3

[[menu.main]]
  name = "Musings"
  url = "/notes/"
  weight = 4

[[menu.main]]
  name = "CV"
  url = "/cv.pdf"
  weight = 5

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2