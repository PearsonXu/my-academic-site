<!-- ============ THEME SWITCHER — 配色切换器 ============ -->
<div class="zx-themes" id="zxThemes" role="group" aria-label="Color theme switcher">
  <span class="zx-tlabel" id="zxTLabel">Ocean</span>
  <button class="zx-tbtn" data-set="ocean" data-name="Ocean" title="Ocean 海洋蓝（默认白天）" aria-label="Ocean blue theme"></button>
  <button class="zx-tbtn" data-set="sand" data-name="Sand" title="Sand 沙漠暖金" aria-label="Sand warm theme"></button>
  <button class="zx-tbtn" data-set="slate" data-name="Slate" title="Slate 石板灰蓝" aria-label="Slate grey-blue theme"></button>
  <button class="zx-tbtn" data-set="ember" data-name="Ember" title="Ember 炭火暖橙" aria-label="Ember dark warm theme"></button>
  <button class="zx-tbtn" data-set="midnight" data-name="Midnight" title="Midnight 午夜黑金（默认黑夜）" aria-label="Midnight dark theme"></button>
</div>

<script>
(function () {
  var root = document.documentElement;
  var buttons = document.querySelectorAll('.zx-tbtn');
  var label = document.getElementById('zxTLabel');
  var DARK_SET = { midnight: 1, ember: 1 };

  /* ---------- helpers ---------- */
  function isDark(name) { return !!DARK_SET[name]; }

  function current() {
    return root.getAttribute('data-theme') || 'ocean';
  }

  function apply(name) {
    root.setAttribute('data-theme', name);
    try {
      localStorage.setItem('zx-theme', name);
      /* Keep PaperMod's key in sync so its head script never overrides us */
      localStorage.setItem('pref-theme', isDark(name) ? 'dark' : 'light');
    } catch (e) {}
    buttons.forEach(function (btn) {
      var on = btn.dataset.set === name;
      btn.classList.toggle('active', on);
      if (on && label) label.textContent = btn.dataset.name;
    });
  }

  /* ---------- init from whatever the head bootstrap set ---------- */
  apply(current());

  /* ---------- 5-colour palette buttons ---------- */
  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () { apply(btn.dataset.set); });
  });

  /* ---------- hijack PaperMod's moon / sun toggle ----------
     PaperMod's footer.html binds its OWN click listener to #theme-toggle
     AFTER this partial runs (it writes data-theme="dark"/"light", which our
     CSS doesn't define → the button appears to "freeze").
     Countermeasures:
     1. cloneNode replaces the original node, dropping any listener already bound;
     2. stopImmediatePropagation blocks PaperMod's listener (bound later to the
        clone) from ever executing — listeners fire in add-order, ours is first. */
  var toggle = document.getElementById('theme-toggle');
  if (toggle) {
    var fresh = toggle.cloneNode(true);
    toggle.parentNode.replaceChild(fresh, toggle);

    fresh.addEventListener('click', function (e) {
      e.stopImmediatePropagation();
      var cur = current();
      /* Light → midnight, Dark → ocean (swap between the two "defaults") */
      apply(isDark(cur) ? 'ocean' : 'midnight');
    });
  }
})();
</script>
