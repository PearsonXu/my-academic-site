<!-- ============ THEME SWITCHER — 配色切换器 ============ -->
<div class="zx-themes" id="zxThemes" role="group" aria-label="Color theme switcher">
  <span class="zx-tlabel" id="zxTLabel">Ocean</span>
  <button class="zx-tbtn" data-set="ocean" data-name="Ocean" title="Ocean 海洋蓝" aria-label="Ocean blue theme"></button>
  <button class="zx-tbtn" data-set="forest" data-name="Forest" title="Forest 森林绿" aria-label="Forest green theme"></button>
  <button class="zx-tbtn" data-set="plum" data-name="Plum" title="Plum 暮光紫" aria-label="Plum purple theme"></button>
  <button class="zx-tbtn" data-set="crimson" data-name="Crimson" title="Crimson 暖珊瑚" aria-label="Crimson theme"></button>
  <button class="zx-tbtn" data-set="midnight" data-name="Midnight" title="Midnight 午夜黑金" aria-label="Midnight dark theme"></button>
</div>

<script>
(function () {
  var root = document.documentElement;
  var buttons = document.querySelectorAll('.zx-tbtn');
  var label = document.getElementById('zxTLabel');
  var saved = localStorage.getItem('zx-theme') || 'ocean';

  function apply(name) {
    root.setAttribute('data-theme', name);
    localStorage.setItem('zx-theme', name);
    buttons.forEach(function (btn) {
      var on = btn.dataset.set === name;
      btn.classList.toggle('active', on);
      if (on && label) label.textContent = btn.dataset.name;
    });
  }

  apply(saved);

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () { apply(btn.dataset.set); });
  });
})();
</script>
