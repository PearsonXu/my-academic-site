<!-- ============ THEME SWITCHER — 配色切换器 ============ -->
<div class="zx-themes" id="zxThemes" role="group" aria-label="Color theme switcher">
  <span class="zx-tlabel" id="zxTLabel">Ocean</span>
  <button class="zx-tbtn" data-set="ocean" data-name="Ocean" title="Ocean 海洋蓝（默认白天）" aria-label="Ocean blue theme"></button>
  <button class="zx-tbtn" data-set="sand" data-name="Sand" title="Sand 沙漠暖金" aria-label="Sand warm theme"></button>
  <button class="zx-tbtn" data-set="slate" data-name="Slate" title="Slate 石板灰蓝" aria-label="Slate grey-blue theme"></button>
  <button class="zx-tbtn" data-set="ember" data-name="Ember" title="Ember 炭火暖橙" aria-label="Ember dark warm theme"></button>
  <button class="zx-tbtn" data-set="midnight" data-name="Midnight" title="Midnight 午夜黑金（默认黑夜）" aria-label="Midnight dark theme"></button>
</div>

<script>
(function () {
  var root = document.documentElement;
  var buttons = document.querySelectorAll('.zx-tbtn');
  var label = document.getElementById('zxTLabel');
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var saved = localStorage.getItem('zx-theme') || (prefersDark ? 'midnight' : 'ocean');

  function apply(name) {
    root.setAttribute('data-theme', name);
    localStorage.setItem('zx-theme', name);
    /* Keep PaperMod's internal key in sync so it never overrides us on reload */
    var pmDark = (name === 'midnight' || name === 'ember');
    localStorage.setItem('pref-theme', pmDark ? 'dark' : 'light');
    buttons.forEach(function (btn) {
      var on = btn.dataset.set === name;
      btn.classList.toggle('active', on);
      if (on && label) label.textContent = btn.dataset.name;
    });
  }

  apply(saved);

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () { apply(btn.dataset.set); });
  });
})();
</script>
