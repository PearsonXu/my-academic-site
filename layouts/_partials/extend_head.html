<!-- Typography: Fraunces (display) + Source Sans 3 (body) + IBM Plex Mono (accent) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Early theme sync: apply saved zx-theme BEFORE PaperMod's own script runs,
     and keep PaperMod's internal key in sync so every page stays consistent. -->
<script>
(function () {
  try {
    var saved = localStorage.getItem('zx-theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = saved || (prefersDark ? 'midnight' : 'ocean');
    document.documentElement.setAttribute('data-theme', theme);
    /* Keep PaperMod's own key aligned so its head script doesn't override us.
       PaperMod uses "pref-theme" key and checks for "dark"/"light" values. */
    var pmDark = (theme === 'midnight' || theme === 'ember');
    localStorage.setItem('pref-theme', pmDark ? 'dark' : 'light');
  } catch (e) {}
})();
</script>
